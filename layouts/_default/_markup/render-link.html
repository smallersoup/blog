{{- $url := urls.Parse .Destination -}}
{{- $siteURL := urls.Parse site.BaseURL -}}
{{- $external := and (ne $url.Host "") (ne (lower $url.Host) (lower $siteURL.Host)) -}}
<a href="{{ .Destination }}"{{ with .Title }} title="{{ . }}"{{ end }}{{ if $external }} target="_blank" rel="noopener noreferrer external"{{ end }}>{{ .Text | safeHTML }}</a>
