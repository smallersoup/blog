<script defer>

    document.head.appendChild(script);

    window.dataLayer = window.dataLayer || [];

      dataLayer.push(arguments);
    }
    gtag('js', new Date());
    gtag('config', 'G-0VHVXWXJMQ');

    // 移除滚动事件监听器，确保脚本只加载一次
    window.removeEventListener('scroll', onScrollLoadAnalytics);
  }

  function onScrollLoadAnalytics() {

  window.addEventListener('scroll', onScrollLoadAnalytics);
</script>

<script defer src="https://wvprxbiaqrgp.hzh.sealos.run/js"></script>
<script>
document.addEventListener('DOMContentLoaded', function () {
  const counts = document.getElementById('site-visit-counts');
  const total = document.getElementById('busuanzi_site_pv');
  if (!counts || !total) return;
  function showCounts() {
    if (/^\d[\d,]*$/.test(total.textContent.trim())) {
      counts.style.removeProperty('display');
    }
  }
  new MutationObserver(showCounts).observe(total, {
    childList: true, subtree: true, characterData: true
  });
  showCounts();
});
</script>
